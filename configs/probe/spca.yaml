defaults:
  - base_probe

# Supervised PCA probe (Single Instance Probe)
name: spca
with_bags: False

init_params:
  n_components: 25
  cov_type: "oas"
  C: 1.0
  verbose: True
param_grid:
  C: [0.05, 0.1, 0.5, 1, 10]
  n_components: [1, 5, 10, 25, 50, 100, 200, 500, 1000]
  cov_type: "empirical" # on search it is better to use empirical covariance (faster)